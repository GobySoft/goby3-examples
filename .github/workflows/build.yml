name: Build

on:
  # PR branches are built by pull_request; also building them on push would run every job twice
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

# a newer push to the same branch or PR supersedes the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64-bookworm-build
            image: gobysoft/goby3-debian-build-base:12.1
            distro_release_codename: bookworm
            distro_release_version: debian12
          - name: amd64-trixie-build
            image: gobysoft/goby3-debian-build-base:13.1
            distro_release_codename: trixie
            distro_release_version: debian13
          - name: amd64-jammy-build
            image: gobysoft/goby3-ubuntu-build-base:22.04.1
            distro_release_codename: jammy
            distro_release_version: ubuntu22.04
          - name: amd64-noble-build
            image: gobysoft/goby3-ubuntu-build-base:24.04.2
            distro_release_codename: noble
            distro_release_version: ubuntu24.04
          - name: amd64-resolute-build
            image: gobysoft/goby3-ubuntu-build-base:26.04.1
            distro_release_codename: resolute
            distro_release_version: ubuntu26.04

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}

    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
      DEBIAN_FRONTEND: noninteractive
      DEBIAN_PRIORITY: critical
      DEBCONF_NOWARNINGS: "yes"
      DISTRO_RELEASE_CODENAME: ${{ matrix.distro_release_codename }}
      DISTRO_RELEASE_VERSION: ${{ matrix.distro_release_version }}
      # Julia is installed from the official generic Linux tarball rather than a distribution
      # package, which is how upstream expects it to be deployed. Bump here to update.
      JULIA_VERSION: "1.12.2"
      D2_VERSION: "0.7.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install packages.gobysoft.org key
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends wget gnupg
          wget -qO- "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x19478082E2F8D3FE" | gpg --dearmor -o /usr/share/keyrings/gobysoft-archive-keyring.gpg

      - name: Add continuous build package sources.list
        run: echo "deb [signed-by=/usr/share/keyrings/gobysoft-archive-keyring.gpg] http://packages.gobysoft.org/ubuntu/continuous/ ${DISTRO_RELEASE_CODENAME}/" >> /etc/apt/sources.list.d/gobysoft_continuous.list

      - name: Update apt packages and install goby3 headers and applications
        run: apt-get update && apt-get -y remove libdccl3-dev libdccl3 && apt-get -y dist-upgrade && apt-get -y install libgoby3-dev goby3-apps clang

      # libgoby3-dev only recommends these, and the image may not install recommends
      - name: Install MOOS, interface tool and figure dependencies
        run: apt-get -y install libgoby3-moos-dev libmavlink-dev goby3-clang-tool goby3-interfaces graphviz

      - name: Install D2
        run: |
          wget -qO /tmp/d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          mkdir -p /opt/d2
          tar xzf /tmp/d2.tar.gz -C /opt/d2 --strip-components=1
          ln -sf /opt/d2/bin/d2 /usr/local/bin/d2
          d2 --version

      # The Python examples need the goby Python package (for the goby module and the
      # goby_gen_cpp generator) and pybind11 to compile the generated extension module.
      # libgoby3-zenoh-dev depends on libzenohc-dev and libzenohcpp-dev, which Eclipse publishes
      # rather than the distributions or packages.gobysoft.org
      - name: Install Zenoh example dependencies
        run: |
          install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://download.eclipse.org/zenoh/debian-repo/zenoh-public-key | gpg --dearmor -o /etc/apt/keyrings/zenoh.gpg
          echo "deb [signed-by=/etc/apt/keyrings/zenoh.gpg] https://download.eclipse.org/zenoh/debian-repo/ /" > /etc/apt/sources.list.d/eclipse_zenoh.list
          apt-get update && apt-get -y install libgoby3-zenoh-dev

      - name: Install Python example dependencies
        run: apt-get -y install python3-goby3 pybind11-dev python3-dev

      - name: Install Julia
        run: |
          wget -qO /tmp/julia.tar.gz \
            "https://julialang-s3.julialang.org/bin/linux/x64/${JULIA_VERSION%.*}/julia-${JULIA_VERSION}-linux-x86_64.tar.gz"
          mkdir -p /opt/julia
          tar xzf /tmp/julia.tar.gz -C /opt/julia --strip-components=1
          ln -sf /opt/julia/bin/julia /usr/local/bin/julia
          julia --version

      # The Julia examples need Goby.jl (goby3-julia) and CxxWrap.jl, whose JlCxx headers are
      # what the generated C++ links against.
      - name: Install Julia example dependencies
        run: |
          apt-get -y install goby3-julia
          julia -e 'import Pkg; Pkg.add("CxxWrap")'

      - name: Configure examples
        # Both are requested explicitly rather than left to autodetection, so that a missing
        # dependency fails the build instead of quietly dropping the examples from it
        run: >
          mkdir -p build && cd build && cmake ..
          -Dbuild_python=ON -Denable_julia_examples=ON -Dbuild_moos=ON
          -Dexport_goby_interfaces=ON -Dbuild_interface_figures_d2=ON
          -Denable_tests=ON -Dbuild_test_figures=ON

      # GobyJulia.cmake warns and turns enable_julia_examples back OFF when a piece is missing,
      # which would otherwise leave this job passing without having built anything Julia
      - name: Check that the Python and Julia examples are enabled
        run: |
          cd build
          for _option in build_python enable_julia_examples; do
            if ! grep -q "^${_option}:BOOL=ON$" CMakeCache.txt; then
              echo "::error::${_option} is not ON: its examples would be silently skipped"
              exit 1
            fi
          done

      - name: Build examples
        run: cd build && cmake --build . -- -j4

      # these are dropped with only a warning or status message when a dependency isn't found
      - name: Check that the optional examples, figures and checks were built
        run: |
          _missing=0
          for _file in \
              bin/goby3_example_basic_zenoh_interprocess_publisher \
              bin/goby3_example_basic_zenoh_interprocess_subscriber \
              bin/goby3_example_mavlink \
              bin/goby3_example_chat \
              lib/libgoby3_example_gps_moos_plugin.so \
              lib/libgoby3_example_trail_moos_plugin.so; do
            if [ ! -e "build/${_file}" ]; then
              echo "::error::${_file} was not built"
              _missing=1
            fi
          done
          _figures=$(ls build/share/interfaces/figures/*.pdf 2>/dev/null | wc -l)
          if [ "${_figures}" -eq 0 ]; then
            echo "::error::no deployment figures were drawn"
            _missing=1
          fi
          for _pdf in build/share/interfaces/figures/*.pdf; do
            if [ ! -e "${_pdf%.pdf}.svg" ]; then
              echo "::error::$(basename ${_pdf%.pdf}).svg (D2) was not rendered"
              _missing=1
            fi
          done
          for _test in goby3_example_interfaces_ goby3_example_launch_; do
            if ! (cd build && ctest -N | grep -q "${_test}"); then
              echo "::error::no ${_test}* tests are registered"
              _missing=1
            fi
          done
          exit ${_missing}

      # the harnesses in test/ launch each example and check its publications with 'goby test'
      - name: Run example tests
        run: cd build && ctest --output-on-failure
