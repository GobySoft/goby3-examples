# Configuration for the Julia slow consumer example. Unlike the C++ examples, the Julia
# applications require a configuration file as their only argument (see Goby.read_cli_cfg()).
app {
    name: "basic_julia_slow_consumer"
}

# work produced at 20 Hz for a consumer that takes 0.5 s an item: it can keep up with 2 Hz
producer_rate: 20
consumer_delay: 0.5

# the consumer queues 10 items; when that is full the oldest is dropped, so the producer keeps
# its rate. Try "block" to see the producer, and the monitor with it, slow to the consumer's pace.
capacity: 10
overflow: "drop_oldest"
