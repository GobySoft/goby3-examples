# Only the interprocess report is declared. The interthread work is left undeclared so that the
# configuration can choose the slow consumer's capacity and overflow policy at launch, through
# Goby.subscribe; a declared subscription takes both from here instead (see basic_multithread).
application:
  name: BasicJuliaBackpressure
  cpp_type: goby.zeromq.SingleThreadApplication
  config:
    scheme: PROTOBUF
    type: goby3_examples.config.BasicJuliaBackpressureConfig

interprocess:
  publishes:
    - group: groups::julia_backpressure
      scheme: PROTOBUF
      type: goby3_examples::protobuf::InterthreadBackpressure
