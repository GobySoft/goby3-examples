# The interprocess traffic goes through the generated C++. The interthread traffic is carried
# between the Julia tasks by Goby.jl and never reaches C++: declaring it here makes it a contract
# Goby.jl holds every INTERTHREAD call to, and puts the tasks in the 'goby interface' diagrams.
#
# The application both publishes and subscribes to groups::julia_nav: the subscriber task sends
# deep reports out, and the publisher task sees each one that goes. thread: names the task that
# makes each call, which only it may then make, and which the diagram draws it on rather than on
# the generated C++ that makes the call on its behalf.
application:
  name: BasicJuliaMultithread
  cpp_type: goby.zeromq.SingleThreadApplication
  config:
    scheme: PROTOBUF
    type: goby3_examples.config.BasicJuliaMultithreadConfig

interprocess:
  publishes:
    - group: groups::julia_nav
      scheme: PROTOBUF
      type: goby3_examples::protobuf::NavigationReport
      thread: SubscriberTask
  subscribes:
    - group: groups::julia_nav
      scheme: PROTOBUF
      type: goby3_examples::protobuf::NavigationReport
      thread: PublisherTask

interthread:
  publishes:
    - group: nav
      scheme: PROTOBUF
      type: goby3_examples.protobuf.NavigationReport
      thread: PublisherTask
    # NATIVE: any Julia type, here a struct defined in multithread.jl
    - group: depth_alert
      scheme: NATIVE
      type: DepthAlert
      thread: SubscriberTask
  subscribes:
    - group: nav
      scheme: PROTOBUF
      type: goby3_examples.protobuf.NavigationReport
      thread: SubscriberTask
      necessity: required
      # only the latest reports matter, so a slow subscriber drops old ones rather than holding
      # up the publisher
      capacity: 10
      overflow: drop_oldest
    - group: depth_alert
      scheme: NATIVE
      type: DepthAlert
      thread: Main
