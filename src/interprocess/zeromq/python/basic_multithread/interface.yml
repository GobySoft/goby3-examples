# The interprocess publication goes through the generated C++. The interthread traffic is carried
# between the Python threads and never reaches C++: declaring it here makes it a contract the
# application is held to, and puts the threads in the 'goby interface' diagrams. The application
# is still a SingleThreadApplication: the C++ side has no idea these threads exist.
application:
  name: BasicPythonMultithread
  cpp_type: goby::zeromq::SingleThreadApplication
  config:
    scheme: PROTOBUF
    type: goby3_example.protobuf.BasicPythonMultithreadConfig

interprocess:
  publishes:
    - group: groups::nav
      scheme: PROTOBUF
      type: protobuf.NavigationReport

interthread:
  publishes:
    - group: raw_nav
      scheme: PROTOBUF
      type: protobuf.NavigationReport
      thread: NavPublisher
    # NATIVE: any Python class, here a dataclass defined in multithread.py
    - group: depth_alert
      scheme: NATIVE
      type: DepthAlert
      thread: DepthWatcher
  subscribes:
    - group: raw_nav
      scheme: PROTOBUF
      type: protobuf.NavigationReport
      thread: DepthWatcher
      necessity: required
    - group: depth_alert
      scheme: NATIVE
      type: DepthAlert
      thread: BasicMultithread
