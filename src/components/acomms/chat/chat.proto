syntax = "proto2";
import "goby/protobuf/option_extensions.proto";
import "dccl/option_extensions.proto";

message ChatMessage
{
    option (dccl.msg) = {
        codec_version: 4
        id: 2
        max_bytes: 32
    };

    required int32 destination = 1 [(dccl.field) = {min: 0 max: 30}];
    required int32 source = 2 [(dccl.field) = {min: 0 max: 30}];
    required string telegram = 3 [(dccl.field) = {max_length: 26}];
}
