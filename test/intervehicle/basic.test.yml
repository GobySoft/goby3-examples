# Harness for launch/intervehicle/basic: basic_vehicle1.launch + basic_vehicle2.launch
#
# Two gobyd instances (vehicle1, vehicle2) linked over the UDP multicast
# modem driver. On vehicle1's interprocess layer the outgoing DCCL report is
# visible under its own group. vehicle2's endpoint is on the intervehicle
# layer: like the example's subscriber, it subscribes to the report on the
# broadcast group (0) from modem 1, and receives it across the link.
#
#   goby test run test/intervehicle/basic.test.yml   (from the repository root, with the examples built and on the PATH)

endpoint:
  - name: veh1
    zeromq: { platform: vehicle1 }
  - name: veh2
    layer: LAYER_INTERVEHICLE
    zeromq: { platform: vehicle2 }

fixture:
  - name: vehicle1
    command: goby_launch -r basic_vehicle1.launch
    cwd: ../../launch/intervehicle/basic
    ready: { output_regex: "All processes running", timeout: 30 }
  - name: vehicle2
    command: goby_launch -r basic_vehicle2.launch
    cwd: ../../launch/intervehicle/basic
    ready: { output_regex: "All processes running", timeout: 30 }

test:
  name: basic intervehicle
  default_timeout: 10

  require_app:
    - endpoint: veh1
      name: [gobyd, goby3_example_basic_intervehicle_publisher]
      timeout: 20
    - endpoint: veh2
      name: [gobyd, goby3_example_basic_intervehicle_subscriber]
      timeout: 20

  run:
    # the publisher runs at 0.1 Hz on a 1 s slot MAC and its first report expires before
    # vehicle2's subscription has been forwarded, so allow a few cycles
    - name: outgoing report on vehicle1
      expect:
        - endpoint: veh1
          group: "groups::nav(;.*)?"
          type: DCCL/dccl.NavigationReport
          min_count: 1
          timeout: 25
          condition:
            - { field: z, op: LE, value: 0 }

    - name: report crosses the link to vehicle2
      expect:
        - endpoint: veh2
          group: "0"
          type: DCCL/dccl.NavigationReport
          intervehicle: { publisher_id: [1] }
          min_count: 1
          timeout: 40
          condition:
            - { field: z, op: LE, value: 0 }
