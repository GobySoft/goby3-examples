# Harness for launch/interprocess/zeromq/state_machine.launch
#
# The example's own controller toggles the state every second, so this test
# launches only gobyd and the state machine app (see state_machine_app_only.launch)
# and drives it from here, checking the round trip StateControl -> StateReport.

endpoint:
  - name: sm
    layer: LAYER_INTERPROCESS
    interprocess: { platform: state_machine }

test:
  name: state machine round trip
  default_timeout: 3

  require_app:
    - endpoint: sm
      name: [gobyd, goby3_example_state_machine_subscriber]
      timeout: 20

  block:
    - name: initial state is OFF
      expect:
        - endpoint: sm
          group: groups::state_report
          type: protobuf.StateReport
          min_count: 1
          match: "current_state: OFF"

    - name: turn on
      publish:
        - endpoint: sm
          group: groups::state_control
          type: protobuf.StateControl
          value: "desired_state: ON"
      expect:
        - endpoint: sm
          group: groups::state_report
          type: protobuf.StateReport
          min_count: 1
          match: "current_state: ON"

    - name: turn off
      publish:
        - endpoint: sm
          group: groups::state_control
          type: protobuf.StateControl
          value: "desired_state: OFF"
      expect:
        - endpoint: sm
          group: groups::state_report
          type: protobuf.StateReport
          min_count: 1
          match: "current_state: OFF"

    # a repeated ON must not produce a second transition
    - name: redundant command is ignored
      publish:
        - endpoint: sm
          group: groups::state_control
          type: protobuf.StateControl
          value: "desired_state: ON"
          repeat: 2
          interval: 0.2
      expect:
        - endpoint: sm
          group: groups::state_report
          type: protobuf.StateReport
          count: 1
          match: "current_state: ON"
          timeout: 2
